<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Load Analysis Bot (IS Codes)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import a professional engineering-appropriate font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e2e8f0; /* Light Slate Gray background */
        }
        .card { 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .file-upload-area {
            border: 2px dashed #94a3b8;
            transition: border-color 0.3s ease;
        }
        .file-upload-area:hover {
            border-color: #3b82f6; /* Blue hover for interaction */
        }
        .text-primary { color: #1e3a8a; } /* Dark Blue for branding */
        .bg-primary { background-color: #1e3a8a; }
        .hover\:bg-primary-dark:hover { background-color: #1e40af; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Main Container -->
    <div class="card w-full max-w-lg bg-white p-8 md:p-10 rounded-3xl">
        
        <!-- Header Section -->
        <h1 class="text-3xl font-bold text-primary mb-1">
            Structural Load Analyzer
        </h1>
        <p class="text-gray-500 mb-8 text-sm">
            IS Code-compliant analysis powered by n8n and Gemini.
        </p>

        <!-- File Input Form -->
        <form id="uploadForm" class="space-y-6">
            <div>
                <label for="file-upload" class="block text-sm font-semibold text-gray-700 mb-2">
                    Upload IS Data Spreadsheet (CSV/TXT)
                </label>
                <div class="file-upload-area mt-1 flex justify-center px-6 pt-5 pb-6 rounded-xl cursor-pointer hover:bg-gray-50 transition duration-150">
                    <div class="space-y-2 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.25A2.25 2.25 0 0 0 17.25 9v-.75a4.5 4.5 0 0 0-9 0v.75A2.25 2.25 0 0 0 4.5 12v2.25m15 0H4.5m15 0v2.25A2.25 2.25 0 0 1 17.25 19.5h-10.5A2.25 2.25 0 0 1 4.5 16.5v-2.25m15 0a.75.75 0 0 1-1.5 0v-2.25a.75.75 0 0 1 1.5 0v2.25Zm-10.5-2.25h1.5m-3 0h-1.5m-3 0h1.5m-3 0h-1.5" />
                        </svg>
                        <div class="flex text-sm text-gray-600 justify-center">
                            <label for="file-upload" class="relative cursor-pointer rounded-md font-medium text-primary hover:text-indigo-800 transition duration-150">
                                <span>Browse or Drag & Drop</span>
                                <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".csv, .txt">
                            </label>
                        </div>
                        <p class="text-xs text-gray-500" id="fileName">Template CSV or TXT file expected.</p>
                    </div>
                </div>
            </div>
            
            <button type="submit" id="submitButton" 
                class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-lg font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-4 focus:ring-primary focus:ring-opacity-50 transition duration-200 ease-in-out disabled:opacity-50 disabled:shadow-none" 
                disabled>
                <span id="buttonText">Analyze Load Characteristics</span>
                <div id="spinner" class="hidden h-5 w-5 border-2 border-white border-t-transparent rounded-full animate-spin ml-3"></div>
            </button>
        </form>

        <!-- Dynamic Status & Result Message Box -->
        <div id="statusMessage" class="mt-6 p-4 rounded-xl text-sm hidden font-medium" role="alert"></div>
    </div>

    <script>
        // CRITICAL: Replace this placeholder with the URL of your activated n8n Webhook node
        const N8N_WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL_HERE'; 

        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file-upload');
        const submitButton = document.getElementById('submitButton');
        const fileNameDisplay = document.getElementById('fileName');
        const statusMessage = document.getElementById('statusMessage');
        const buttonText = document.getElementById('buttonText');
        const spinner = document.getElementById('spinner');

        // --- Event Listeners ---

        fileInput.addEventListener('change', (event) => {
            if (event.target.files.length > 0) {
                fileNameDisplay.textContent = `File Ready: ${event.target.files[0].name}`;
                submitButton.disabled = false;
                fileNameDisplay.classList.remove('text-gray-500');
                fileNameDisplay.classList.add('text-green-600');
            } else {
                fileNameDisplay.textContent = 'Template CSV or TXT file expected.';
                submitButton.disabled = true;
                fileNameDisplay.classList.add('text-gray-500');
                fileNameDisplay.classList.remove('text-green-600');
            }
            statusMessage.classList.add('hidden');
        });

        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            // 1. Set UI to Loading State
            submitButton.disabled = true;
            buttonText.textContent = 'Analyzing...';
            spinner.classList.remove('hidden');
            statusMessage.classList.add('hidden');
            
            const reader = new FileReader();

            reader.onload = async (event) => {
                const fileContent = event.target.result;
                
                try {
                    // 2. Send Data to n8n Webhook
                    const response = await fetch(N8N_WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ spreadsheetData: fileContent }),
                    });

                    // 3. Handle Response
                    if (response.ok) {
                        // Success: Workflow triggered. The final report is emailed/stored via n8n.
                        showStatus('success', '✅ Analysis triggered successfully! The structural report is now being generated in the n8n workflow.');
                    } else {
                        // Failure: Webhook received the request but returned an error status (e.g., 500 from n8n)
                        const errorText = await response.text();
                        showStatus('error', `❌ Analysis failed. Status: ${response.status}. Please check n8n logs for details. (Response: ${errorText.substring(0, 100)}...)`);
                    }

                } catch (error) {
                    // Critical Failure: Network or CORS error
                    console.error('Fetch error:', error);
                    showStatus('error', `🛑 Critical Error: Could not connect to the n8n webhook. Is the URL correct and the workflow active?`);
                } finally {
                    // 4. Reset Button State
                    submitButton.disabled = false;
                    buttonText.textContent = 'Analyze Load Characteristics';
                    spinner.classList.add('hidden');
                }
            };

            reader.onerror = (error) => {
                console.error('File reading error:', error);
                showStatus('error', '❌ Error reading the uploaded file.');
            };

            // Read the file content as plain text (essential for CSV processing)
            reader.readAsText(file);
        });

        function showStatus(type, message) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
            
            if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                statusMessage.classList.add('bg-red-100', 'text-red-800');
            }
        }
    </script>

</body>
</html>
